name: Build DEB on Tag

on:
  push:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GXDE APT source manually
        run: |
          apt update && apt install wget -y
          # 1. 下载 GPG 公钥（请根据 GXDE 文档确认实际 URL）
          wget -O /tmp/gxde-testing-source.deb \
            https://repo.gxde.top/gxde-os/lizhi/g/gxde-testing-source/gxde-testing-source_1.1.6_all.deb

          apt install /tmp/gxde-testing-source.deb -y
          
          # 3. 更新索引
          apt update

      - name: Install build dependencies
        run: |
          apt update && DEBIAN_FRONTEND=noninteractive apt-get install -y qtchooser build-essential devscripts debhelper fakeroot equivs qt6-base-dev qmake6 && DEBIAN_FRONTEND=noninteractive mk-build-deps --install --remove --tool='apt -y' debian/control 
          # 按需安装其他编译依赖

      - name: Build DEB package
        run: |
          # 同方案一，根据项目选择构建命令
          dpkg-buildpackage -us -uc -b
          echo "请替换为实际的构建命令"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            ../*.deb
            ./*.deb
